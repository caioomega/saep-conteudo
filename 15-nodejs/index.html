<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Node.js</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 24px auto; padding: 0 16px; }
        input, button { padding: 7px; margin: 4px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #1f4e79; color: white; }
        .alerta td { background: #fdedec; }
        #msg { padding: 8px; }
    </style>
</head>
<body>
    <h1>Produtos (Node.js + SQLite)</h1>
    <div id="msg"></div>

    <form id="form">
        <input type="hidden" id="id">
        <input id="nome" placeholder="Nome">
        <input id="quantidade" type="number" min="0" placeholder="Quantidade">
        <input id="estoque_minimo" type="number" min="0" placeholder="Estoque mínimo">
        <button type="submit">Salvar</button>
        <button type="button" onclick="limpar()">Cancelar</button>
    </form>

    <input id="busca" placeholder="Buscar..." oninput="carregar()">

    <table>
        <thead><tr><th>Nome</th><th>Qtd.</th><th>Mínimo</th><th>Ações</th></tr></thead>
        <tbody id="tabela"></tbody>
    </table>

<script>
    // fetch = o navegador "conversa" com o servidor (a API do servidor.js)
    const $ = (id) => document.getElementById(id);
    let lista = [];

    function mensagem(texto, cor) { $("msg").innerHTML = '<span style="color:' + cor + '">' + texto + "</span>"; }

    // LISTAR
    async function carregar() {
        const resposta = await fetch("/api/produtos?busca=" + encodeURIComponent($("busca").value));
        lista = await resposta.json();
        $("tabela").innerHTML = lista.map(p =>
            '<tr class="' + (p.quantidade < p.estoque_minimo ? "alerta" : "") + '">' +
            "<td>" + p.nome.replace(/</g, "&lt;") + "</td><td>" + p.quantidade + "</td><td>" + p.estoque_minimo + "</td>" +
            '<td><button onclick="editar(' + p.id + ')">Editar</button> <button onclick="excluir(' + p.id + ')">Excluir</button></td></tr>'
        ).join("");
    }

    // CADASTRAR ou EDITAR
    $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = $("id").value;
        const dados = { nome: $("nome").value, quantidade: $("quantidade").value, estoque_minimo: $("estoque_minimo").value };
        const resposta = await fetch(id ? "/api/produtos/" + id : "/api/produtos", {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados),
        });
        const r = await resposta.json();
        if (!resposta.ok) return mensagem(r.erro, "red");
        mensagem(id ? "Alterado!" : "Cadastrado!", "green");
        limpar();
        carregar();
    });

    function editar(id) {
        const p = lista.find(p => p.id === id);
        $("id").value = p.id; $("nome").value = p.nome;
        $("quantidade").value = p.quantidade; $("estoque_minimo").value = p.estoque_minimo;
    }

    async function excluir(id) {
        if (!confirm("Excluir?")) return;
        await fetch("/api/produtos/" + id, { method: "DELETE" });
        mensagem("Excluído!", "green");
        carregar();
    }

    function limpar() { $("form").reset(); $("id").value = ""; }

    carregar();
</script>
</body>
</html>
