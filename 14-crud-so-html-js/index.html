<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - só HTML e JavaScript</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!-- ======================================================
         TELA DE LOGIN (aparece primeiro)
         ====================================================== -->
    <div id="tela-login" class="caixa-login">
        <h1>Entrar</h1>
        <div id="erro-login"></div>
        <form id="form-login">
            <label for="login">Login</label>
            <input type="text" id="login" required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" required>
            <button type="submit" style="width:100%">Entrar</button>
        </form>
        <p style="font-size:13px;color:#666">Teste: admin / 123</p>
    </div>

    <!-- ======================================================
         SISTEMA (escondido até fazer login)
         ====================================================== -->
    <div id="tela-sistema" style="display:none">
        <div class="topo">
            <span>Usuário: <strong id="nome-usuario"></strong></span>
            <nav><a href="#" id="sair">Sair</a></nav>
        </div>

        <div class="conteudo">
            <div id="mensagem"></div>

            <h1 id="titulo-form">Novo produto</h1>
            <form id="form-produto">
                <!-- id escondido: vazio = cadastrar, preenchido = editar -->
                <input type="hidden" id="id">
                <label for="nome">Nome *</label>
                <input type="text" id="nome">
                <label for="quantidade">Quantidade *</label>
                <input type="number" id="quantidade" min="0">
                <label for="minimo">Estoque mínimo *</label>
                <input type="number" id="minimo" min="0">
                <button type="submit">Salvar</button>
                <button type="button" id="cancelar" class="botao-perigo">Cancelar</button>
            </form>

            <h2>Movimentar estoque</h2>
            <form id="form-mov" class="busca">
                <div style="flex:2"><label for="mov-produto">Produto</label><select id="mov-produto"></select></div>
                <div style="flex:1"><label for="mov-tipo">Tipo</label>
                    <select id="mov-tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div>
                <div style="flex:1"><label for="mov-qtd">Qtd.</label><input type="number" id="mov-qtd" min="1"></div>
                <div style="flex:1"><label for="mov-data">Data</label><input type="date" id="mov-data"></div>
                <button type="submit">Registrar</button>
            </form>

            <h2>Produtos (ordem alfabética - Bubble Sort)</h2>
            <div class="busca">
                <div style="flex:1"><label for="busca">Buscar</label><input type="text" id="busca" placeholder="digite pra filtrar"></div>
            </div>
            <table>
                <thead><tr><th>Nome</th><th>Qtd.</th><th>Mínimo</th><th>Ações</th></tr></thead>
                <tbody id="tabela"></tbody>
            </table>

            <h2>Histórico</h2>
            <table>
                <thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd.</th><th>Usuário</th></tr></thead>
                <tbody id="historico"></tbody>
            </table>

            <p><button type="button" id="zerar" class="botao-perigo">Apagar todos os dados (recomeçar)</button></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
